# The production stack: Caddy (HTTPS + the built frontend) in front of the API and Postgres. Run on the
# server by deploy/aws-deploy.sh; its settings come from the server-only deploy/.env (never in git).
# Only Caddy publishes host ports; the API and the database are reachable inside the stack only.
# On the server COMPOSE_PROJECT_NAME is unset; in a checkout ./dc sets it, keeping gate runs apart.
name: ${COMPOSE_PROJECT_NAME:-newstepsincoding}-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    restart: unless-stopped
    # Migrations, then the API without auto-reload; Caddy is the only proxy in front of it.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/app
      APP_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?set in deploy/.env}
      FRONTEND_URL: https://${SITE_HOST:?set in deploy/.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
      additional_contexts:
        caddyfile: .
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy-data:
