# The local stack: Postgres + FastAPI backend + React (Vite) frontend. Start it with `./dc up`.
# Every host port is `${VAR:-default}`: unset, you get the default; Jaah's worktrees set their own.
# Host ports bind to 127.0.0.1 only.
name: ${COMPOSE_PROJECT_NAME:-newstepsincoding}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      APP_ENV: ${APP_ENV:-local}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5173/"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - backend

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-newstepsincoding}-pgdata
